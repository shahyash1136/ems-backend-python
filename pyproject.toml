[project]
name = "ems-backend-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yash Shah", email = "43175218+shahyash1136@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ems-backend-python = "ems_backend_python:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true
